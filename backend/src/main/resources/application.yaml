spring:
  application:
    name: stockwise

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockwise_db}
    username: ${SPRING_DATASOURCE_USERNAME:stockwise}
    password: ${SPRING_DATASOURCE_PASSWORD:stockwise}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

stockwise:
  cors:
    allowed-origins: ${STOCKWISE_CORS_ORIGINS:http://localhost:5173,http://localhost:8090}
